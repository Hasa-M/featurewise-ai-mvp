services:
  postgres:
    image: postgres:16
    container_name: featurewise-postgres
    restart: unless-stopped
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: "${DATABASE_USER:?DATABASE_USER is required}"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}"
      POSTGRES_DB: "${DATABASE_NAME:?DATABASE_NAME is required}"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
